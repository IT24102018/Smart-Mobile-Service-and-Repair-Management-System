<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Management - Mobix Admin</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .users-table-container {
            margin-top: 2rem;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .user-table th,
        .user-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .user-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-admin {
            background-color: #fef3c7;
            color: #d97706;
        }

        .badge-user {
            background-color: #e0e7ff;
            color: #4f46e5;
        }
    </style>
</head>

<body class="auth-page">
    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="/images/logo.svg" alt="Mobix Logo" width="50">
            <h1>Mobix Admin</h1>
        </div>
        <nav>
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/users}">User Management</a>
            <a th:href="@{/admin/product/add}">Add Product</a>
            <a th:href="@{/admin/customer-services}">Customer Services</a>
            <a th:href="@{/}">View Site</a>
            <a th:href="@{/admin/logout}">Logout</a>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <div class="admin-header">
                <h2>&#128101; User Management</h2>
                <p>Welcome, <span th:text="${adminEmail}">Admin</span></p>
            </div>

            <div class="admin-stats">
                <div class="stat-card">
                    <span class="stat-number" th:text="${#lists.size(users)}">0</span>
                    <span class="stat-label">Total Users</span>
                </div>
            </div>

            <div class="users-table-container">
                <h3>All Registered Users</h3>
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.name}">John Doe</td>
                            <td th:text="${user.email}">john@example.com</td>
                            <td th:text="${user.phone}">1234567890</td>
                            <td>
                                <span class="badge"
                                    th:classappend="${user.role == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                                    th:text="${user.role}">USER</span>
                            </td>
                            <td class="actions">
                                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn-delete"
                                    onclick="return confirm('Are you sure you want to delete this user? This action cannot be undone.')">&#128465;
                                    Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        
        
    </footer>
</body>

</html>
