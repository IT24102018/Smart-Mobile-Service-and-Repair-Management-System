<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Mobix</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
<!-- HEADER -->
<header>
    <div class="logo">
        <img src="/images/logo.svg" alt="Mobix Logo" width="50">
        <h1>Mobix</h1>
    </div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/contact}">Contact Us</a>
        </nav>
</header>

<main>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-icon">&#128273;</div>
            <h2>Admin Login</h2>
            <p class="login-subtitle">Authorized personnel only</p>

            <p th:if="${error}" class="error-message">[[${error}]]</p>

            <form th:action="@{/admin/login}" method="post" class="admin-login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-admin-login">Login</button>
            </form>

            <div class="login-help">
                <p>Default Credentials:</p>
                <code>Email: lakindunuwan2005@icloud.com</code>
                <code>Password: Admin123</code>
            </div>
        </div>
    </div>
</main>

</body>
</html>
