<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Mobix</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
<!-- HEADER -->
<header>
    <div class="logo">
        <img src="/images/logo.svg" alt="Mobix Logo" width="50">
        <h1>Mobix</h1>
    </div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/users/dashboard}">Dashboard</a>
        <a th:href="@{/shop}">Shop</a>
        <a th:href="@{/contact}">Contact Us</a>
        <a th:href="@{/users/logout}">Logout</a>
    <a th:href="@{/reviews/add}">Feedback</a>
        </nav>
</header>

<main>
    <div class="checkout-container">
        <h2>&#128722; Checkout</h2>
        
        <p th:if="${error}" class="error-message">[[${error}]]</p>

        <div class="checkout-grid">
            <!-- Product Summary -->
            <div class="product-summary" th:if="${product != null}">
                <h3>Order Summary</h3>
                <div class="checkout-product">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}">
                    <div class="checkout-product-info">
                        <span class="product-brand" th:text="${product.brand}">Brand</span>
                        <h4 th:text="${product.name}">Product Name</h4>
                        <p th:text="${product.description}">Description</p>
                        <span class="checkout-price">Rs. <span th:text="${product.price}">0.00</span></span>
                    </div>
                </div>
            </div>
            
            <div th:if="${product == null}" class="error-message">
                <h3>Product Not Available</h3>
                <p>The product you're trying to purchase is not available.</p>
                <a th:href="@{/shop}" class="btn-shop-now">Back to Shop</a>
            </div>

            <!-- Checkout Form -->
            <div class="checkout-form" th:if="${product != null}">
                <h3>Shipping & Payment Details</h3>
                <form th:action="@{/order/checkout}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="customerName" th:value="${customerName}" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="customerEmail" th:value="${customerEmail}" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="customerPhone" th:value="${customerPhone}" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label>Shipping Address</label>
                        <textarea name="shippingAddress" rows="3" placeholder="Enter your complete shipping address" required th:text="${shippingAddress}"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="CREDIT_CARD" checked>
                                <span>&#128179; Credit Card</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="DEBIT_CARD">
                                <span>&#128179; Debit Card</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY">
                                <span>&#128176; Cash on Delivery</span>
                            </label>
                        </div>
                    </div>

                    <div class="checkout-total">
                        <span>Total Amount:</span>
                        <span class="total-price">Rs. <span th:text="${product.price}">0.00</span></span>
                    </div>

                    <button type="submit" class="btn-checkout">Proceed to Payment &#10132;</button>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
</footer>
</body>
</html>
