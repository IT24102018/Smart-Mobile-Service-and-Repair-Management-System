<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Technician Login - Mobix</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="auth-page">
    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="/images/logo.svg" alt="Mobix Logo" width="50">
            <h1>Mobix</h1>
        </div>
        <nav>
            <a th:href="@{/}">Home</a>
        <a th:href="@{/reviews/add}">Feedback</a>
        </nav>
    </header>

    <main>
        <div class="admin-login-container">
            <div class="admin-login-card">
                <div class="admin-icon">&#128104;&#8205;&#128295;</div>
                <h2>Technician Login</h2>
                <p class="login-subtitle">Mobix Technical Team</p>

                <p th:if="${error}" class="error-message">[[${error}]]</p>

                <form th:action="@{/technician/login}" method="post" class="admin-login-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="Enter technician email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn-admin-login">Login</button>
                </form>

                <div class="login-help">
                    <p>Default Credentials:</p>
                    <code>Email: technician@gmail.com</code>
                    <code>Password: mobix123</code>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
    </footer>
</body>

</html>
